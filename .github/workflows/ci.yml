name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forti_intel
          POSTGRES_PASSWORD: forti_ci_test_password
          POSTGRES_DB: forti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite (Unit, Integration, and E2E)
        env:
          TEST_DATABASE_URL: postgresql://forti_intel:forti_ci_test_password@localhost:5432/forti_test
          GCHAT_DRY_RUN: "true"
        run: |
          pytest -v --durations=10
