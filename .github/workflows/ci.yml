name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forti_intel
          POSTGRES_PASSWORD: forti_ci_test_password
          POSTGRES_DB: forti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite (Unit, Integration, and E2E)
        env:
          TEST_DATABASE_URL: postgresql://forti_intel:forti_ci_test_password@localhost:5432/forti_test
          GCHAT_DRY_RUN: "true"
        run: |
          pytest -v --durations=10

  container-smoke:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forti_intel
          POSTGRES_PASSWORD: forti_ci_test_password
          POSTGRES_DB: forti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t forti-intel:test .

      - name: Verify container startup, readiness, migrations, and graceful exit
        run: |
          docker run -d --name forti-agent --network host \
            -e DATABASE_URL="postgresql://forti_intel:forti_ci_test_password@localhost:5432/forti_test" \
            -e LOKI_BASE_URL="http://127.0.0.1:9999/loki/api/v1/query_range" \
            -e LOKI_TLS_VERIFY="true" \
            -e ALLOW_INSECURE_TLS="true" \
            -e LLM_BASE_URL="http://127.0.0.1:9999/v1" \
            -e GCHAT_DRY_RUN="true" \
            -e METRICS_PORT="8000" \
            forti-intel:test

          sleep 20

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health/ready || echo "000")
          echo "Health ready HTTP code: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Health ready check failed!"
            docker logs forti-agent
            exit 1
          fi

          MIGRATIONS=$(docker run --network host postgres:16-alpine psql "postgresql://forti_intel:forti_ci_test_password@localhost:5432/forti_test" \
            -t -A -c "SELECT version FROM schema_migrations;")
          echo "Applied schema migrations:"
          echo "${MIGRATIONS}"
          echo "${MIGRATIONS}" | grep -q "004_phase_b1"

          docker stop -t 10 forti-agent
          EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' forti-agent)
          echo "Container stop exit code: ${EXIT_CODE}"
          test "${EXIT_CODE}" -eq 0
