version: "1.0.0"
rules:
  - id: "RULE_NONBLOCKED_EXPLOIT_ATTEMPT"
    name: "Non-Blocked High-Impact Exploit Detection"
    description: "UTM IPS or WAF detected exploit payload where enforcement was NOT blocked (passthrough/monitor mode)."
    priority: "URGENT_ALERT_AND_INVESTIGATE"
    min_severity: "CRITICAL"
    condition:
      type: "utm"
      subtypes: ["ips", "waf"]
      enforcement: ["ALLOWED_OR_DETECTED", "MIXED"]
      required_evidence: "utm"
    reason_template: "FortiGate DPI detected high-impact attack payload ({signature}) reaching application without perimeter blocking."

  - id: "RULE_MIXED_ENFORCEMENT_SEQUENCE"
    name: "Mixed Enforcement Attack Sequence"
    description: "Source IP exhibits both blocked probes and allowed connections within the same episode."
    priority: "INVESTIGATE"
    min_severity: "HIGH"
    condition:
      enforcement: ["MIXED"]
      min_events: 2
      required_evidence: "utm"
    reason_template: "Mixed enforcement sequence detected across UTM events ({event_count} events; mixed enforcement, not proven bypass)."

  - id: "RULE_HIGH_FREQUENCY_SCANNER"
    name: "High Frequency Perimeter Scanner"
    description: "Source IP repeatedly blocked across multiple services or endpoints within the correlation window."
    priority: "DIGEST"
    min_severity: "MEDIUM"
    condition:
      enforcement: ["BLOCKED"]
      direction: "INBOUND"
      source_not_in: "trusted_networks"
      min_events: 10
    reason_template: "Persistent external automated scanner detected ({event_count} blocked attempts)."

  - id: "RULE_PORT_SCAN_MULTI_SERVICE"
    name: "Horizontal Port Scanner Across Multiple Services"
    description: "Single external source targeting multiple distinct services or ports."
    priority: "DIGEST"
    min_severity: "MEDIUM"
    condition:
      direction: "INBOUND"
      source_not_in: "trusted_networks"
      min_distinct_services: 3
      min_events: 3
    reason_template: "Source IP probed multiple distinct network services ({event_count} events across multiple ports)."

  - id: "RULE_DISTRIBUTED_ATTACK"
    name: "Distributed Attack Against Protected Target"
    description: "Multiple sources targeting the same protected destination within correlation window."
    priority: "INVESTIGATE"
    min_severity: "HIGH"
    condition:
      direction: "INBOUND"
      min_distinct_sources: 3
    reason_template: "Distributed attack coordinated across multiple source IPs ({event_count} events)."

  - id: "RULE_SSL_INSPECTION_ANOMALY"
    name: "Deep Inspection SSL Evasion Attempt"
    description: "TLS handshake anomalies, unsupported cipher suites, or untrusted certs during inbound deep inspection."
    priority: "INVESTIGATE"
    min_severity: "HIGH"
    condition:
      type: "utm"
      subtypes: ["ssl"]
      status_not: ["success"]
      required_evidence: "utm"
    reason_template: "Inbound deep SSL inspection failure or evasion anomaly detected: {reason}"

  - id: "RULE_ANTIVIRUS_DETECTION"
    name: "Malicious Payload / Virus Detected"
    description: "FortiGate Antivirus profile matched a malicious file transfer without perimeter blocking."
    priority: "URGENT_ALERT_AND_INVESTIGATE"
    min_severity: "CRITICAL"
    condition:
      type: "utm"
      subtypes: ["virus"]
      enforcement: ["ALLOWED_OR_DETECTED"]
      required_evidence: "utm"
    reason_template: "Antivirus inspection detected unblocked malware payload: {signature}"

  - id: "RULE_ANTIVIRUS_BLOCKED"
    name: "Malicious Payload / Virus Blocked"
    description: "FortiGate Antivirus blocked a file download."
    priority: "DIGEST"
    min_severity: "MEDIUM"
    condition:
      type: "utm"
      subtypes: ["virus"]
      enforcement: ["BLOCKED"]
      required_evidence: "utm"
    reason_template: "Antivirus inspection blocked malware transfer: {signature}"

  - id: "RULE_UNKNOWN_ACTION_MAPPING"
    name: "Unknown Log Action Visibility Gap"
    description: "One or more events carried unmapped FortiOS action values."
    priority: "DIGEST"
    min_severity: "LOW"
    routing_outcome: "RETAIN_WITH_VISIBILITY_GAP"
    condition:
      action_normalized: "UNKNOWN"
    reason_template: "Unmapped FortiOS action observed in log stream requiring configuration review."

  - id: "RULE_HIGH_PARSER_ERROR_RATE"
    name: "High Log Parser Error Burst"
    description: "Parser failure rate exceeds operational threshold."
    priority: "DIGEST"
    min_severity: "LOW"
    routing_outcome: "RETAIN_WITH_VISIBILITY_GAP"
    condition:
      health_metric: "parser_errors"
      min_events: 5
    reason_template: "Parser error burst observed indicating possible log format mismatch."

  - id: "RULE_LOG_SILENCE"
    name: "Loki Ingestion Silence Detected"
    description: "No log events received within expected polling intervals."
    priority: "DIGEST"
    min_severity: "LOW"
    routing_outcome: "RETAIN_WITH_VISIBILITY_GAP"
    condition:
      health_metric: "log_silence"
    reason_template: "Log stream silence detected; poller observed zero events exceeding expected cadence."

  - id: "RULE_COVERAGE_GAP"
    name: "Loki Query Coverage Gap"
    description: "Coverage gap recorded due to query saturation or rate limits."
    priority: "DIGEST"
    min_severity: "LOW"
    routing_outcome: "RETAIN_WITH_VISIBILITY_GAP"
    condition:
      health_metric: "coverage_gap"
    reason_template: "Coverage gap detected in Loki stream requiring operator review."

  - id: "RULE_PROCESSING_BACKLOG"
    name: "Event Processing Inbox Backlog"
    description: "Pending events inbox backlog growing faster than processing capacity."
    priority: "DIGEST"
    min_severity: "LOW"
    routing_outcome: "RETAIN_WITH_VISIBILITY_GAP"
    condition:
      health_metric: "processing_backlog"
      min_events: 500
    reason_template: "Event ingestion backlog observed in durable inbox."
